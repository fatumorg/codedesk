[package]
name = "codedesk"
version = "0.2.1"
edition = "2021"
description = "Codedesk: a desktop workspace for Claude Code"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
axum = "0.8"
futures-util = "0.3"
sha2 = "0.10"
getrandom = "0.3"
portable-pty = "0.9"
chrono = "0.4"
resvg = "0.45"
trash = "5"
regex = "1"
enigo = { version = "0.6.1", features = ["wayland"] }
xcap = { version = "0.9.8", features = ["image"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
